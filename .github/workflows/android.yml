                    const presetData = presets[e.target.value];
                    
                    // Reset to default first
                    Object.keys(DSP_CONFIG).forEach(modId => {
                        AppState[AppState.activeState][modId].enabled = false;
                        DSP_CONFIG[modId].params.forEach(p => AppState[AppState.activeState][modId][p.id] = p.default);
