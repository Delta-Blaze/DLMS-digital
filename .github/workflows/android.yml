        window.runSelfTests = function() {
            Utils.log("Starting Automated Self-Tests...");
            const results = [];
            let passCount = 0; let failCount = 0;
            
            const assert = (condition, msg) => {
                if(condition) { passCount++; results.push(`[PASS] ${msg}`); }
                else { failCount++; results.push(`[FAIL] ${msg}`); }
            };

            try {
                // DOM Tests
                assert(document.getElementById('audioFileInput') !== null, "File Input exists");
                assert(document.getElementById('modulesRack').children.length > 5, "DSP Modules generated in UI");
                
                // Audio Engine Tests
                assert(engine.ctx !== null, "AudioContext created");
                assert(engine.masterGain !== null, "Master Gain Node created");
                assert(engine.analyser !== null, "Analyser Node created");
                
                // Nodes Tests
                const activeModIds = Object.keys(engine.nodes);
                assert(activeModIds.length === Object.keys(DSP_CONFIG).length, "All configured DSP nodes instantiated");
                
                let routingValid = true;
                activeModIds.forEach(id => {
                    if(!engine.nodes[id].input || !engine.nodes[id].output) routingValid = false;
                });
                assert(routingValid, "All DSP nodes have Input/Output interfaces");

                // Parameter Update Test (Non-destructive)
                const preTestVal = AppState[AppState.activeState].preamp.gain;
                UIManager.updateParam('preamp', 'gain', 5.5);
                assert(AppState[AppState.activeState].preamp.gain === 5.5, "State updates correctly from parameter change");
                UIManager.updateParam('preamp', 'gain', preTestVal); // revert
                
                // Feature Checks
                assert(typeof ArrayBuffer !== 'undefined', "ArrayBuffer supported");
                assert(typeof localStorage !== 'undefined', "LocalStorage available");
                
            } catch(e) {
                failCount++;
                results.push(`[CRITICAL EXCEPTION] ${e.message}`);
            }

            const report = `PROJECT: DLMS Digital Audio Processor
FEATURES: Routing, EQ, Dynamics, Effects, Presets, Analyzer
====================================
TEST RESULTS:
Total: ${passCount + failCount}
Passed: ${passCount}
Failed: ${failCount}
Success Rate: ${Math.round((passCount/(passCount+failCount))*100)}%
====================================
DETAILED LOG:
${results.join('\n')}
====================================
ERROR CHECK: No unhandled exceptions caught during startup.
BROWSER: ${navigator.userAgent}`;

            document.getElementById('diagContent').innerText = report;
            Utils.log("Tests complete.");
        };

        window.addEventListener('load', () => {
            const btnStart = document.getElementById('btnStartEngine');
            const bootOverlay = document.getElementById('bootOverlay');
            
            Utils.log("Aplikasi ini dibuat oleh DeltaBlaze tolong agar tidak diperjual belikan.");
            btnStart.classList.remove('hidden');
            
            btnStart.addEventListener('click', async () => {
                btnStart.innerText = "Initializing...";
                btnStart.disabled = true;
                
                try {
                    await engine.init();
                    UIManager.init();
                    
                    bootOverlay.classList.remove('active');
                    Utils.log("System Ready.");
                } catch(e) {
                    Utils.log(`INIT ERROR: ${e.message}`);
                    btnStart.innerText = "Initialization Failed";
                }
            });
        });

    </script>
</body>
