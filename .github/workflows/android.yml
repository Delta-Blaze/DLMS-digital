<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLMS Digital Audio Processor PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        daw: {
                            900: '#0f0f13',
                            800: '#18181d',
                            700: '#22222a',
                            600: '#2d2d38',
                            500: '#3f3f4e',
                            accent: '#00d2ff',
                            warn: '#ff3366',
                            success: '#00ff66',
                            active: '#ffaa00'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --accent: #00d2ff;
            --bg-main: #0f0f13;
            --bg-panel: #18181d;
            --text-main: #e2e8f0;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
            user-select: none;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f13; 
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f4e; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a6b; 
        }
        
        .fader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 54px;
            height: 140px;
            margin: 0.5rem;
        }
        .fader-label {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }
        .fader-track-wrapper {
            position: relative;
            height: 100px;
            width: 32px;
            display: flex;
            justify-content: center;
            cursor: pointer;
        }
        .fader-track {
            position: absolute;
            width: 4px;
            height: 100%;
            background: #000;
            border-radius: 2px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.1);
        }
        .fader-track::before {
            content: '';
            position: absolute;
            left: -10px; right: -10px; top: 0; bottom: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 9px,
                #2d2d38 9px,
                #2d2d38 10px
            );
            z-index: 0;
            opacity: 0.5;
        }
        .fader-thumb {
            position: absolute;
            width: 28px;
            height: 12px;
            background: #3f3f4e;
            border: 1px solid #18181d;
            border-radius: 2px;
            bottom: 0;
            transform: translateY(50%);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.2);
            z-index: 10;
            transition: background 0.1s;
        }
        .fader-thumb::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 2px;
            right: 2px;
            height: 2px;
            background: var(--accent);
            transform: translateY(-50%);
            box-shadow: 0 0 4px var(--accent);
        }
        .fader-track-wrapper:hover .fader-thumb {
            background: #5a5a6b;
        }
        .fader-value {
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            color: #e2e8f0;
            margin-top: 8px;
        }

        .rack-module {
            background: var(--bg-panel);
            border: 1px solid #2d2d38;
            border-radius: 8px;
            padding: 1rem;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #2d2d38;
        }
        .power-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3f3f4e;
            cursor: pointer;
            transition: all 0.2s;
        }
        .power-btn.active {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .meter-container {
            width: 12px;
            height: 100%;
            background: #0f0f13;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .meter-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #00ff66, #ffaa00, #ff3366);
            transition: height 0.05s ease-out;
        }
        .meter-peak {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: #ff3366;
            transition: top 0.1s ease-out;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .overlay.active { display: flex; }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: var(--bg-panel);
            border: 1px solid #3f3f4e;
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn:hover { background: #2d2d38; border-color: var(--accent); }
        .btn.active { background: var(--accent); color: black; font-weight: bold; }
        
        .timeline-container {
            width: 100%; height: 24px; background: #0f0f13; border-radius: 4px; position: relative; cursor: pointer;
        }
        .timeline-progress {
            height: 100%; background: rgba(0, 210, 255, 0.3); border-radius: 4px; width: 0%; pointer-events: none; border-right: 2px solid var(--accent);
        }
    </style>
</head>
<body class="flex flex-col h-screen font-sans text-sm">

    <header class="h-14 bg-daw-800 border-b border-daw-600 flex items-center justify-between px-4 shrink-0 z-10">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-daw-accent to-blue-500">DLMS Digital</h1>
            <div class="h-6 w-px bg-daw-600 mx-2"></div>
            <label class="btn cursor-pointer flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Load Audio
                <input type="file" id="audioFileInput" accept="audio/*" class="hidden">
            </label>
            <span id="fileNameDisplay" class="text-xs font-mono text-gray-400 truncate w-48">No file loaded</span>
        </div>
        
        <div class="flex items-center gap-2">
            <button class="btn" id="btnToggleAB" title="Shortcut: A">State: A</button>
            <button class="btn" id="btnCopyAB">Copy A->B</button>
            <select id="presetSelect" class="bg-daw-900 border border-daw-500 rounded px-2 py-1 text-xs text-white outline-none focus:border-daw-accent w-48">
                <option value="">-- Load Preset --</option>
            </select>
            <button class="btn" id="btnSavePreset">Save</button>
            <button class="btn border-daw-warn text-daw-warn hover:bg-daw-warn hover:text-white" id="btnPanic">Panic Stop</button>
            <button class="btn" id="btnDiagnostics">Diagnostics</button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- Sidebar: Routing / Chain -->
        <aside class="w-64 bg-daw-800 border-r border-daw-600 flex flex-col shrink-0">
            <div class="p-3 border-b border-daw-600 font-semibold text-gray-300">By:DeltaBlaze</div>
            <div class="flex-1 overflow-y-auto p-2 space-y-2" id="chainContainer">
                <!-- Chain items generated via JS -->
            </div>
            <div class="p-4 border-t border-daw-600 flex justify-between">
                <button class="btn text-xs" id="btnResetChain">Reset Order</button>
                <button class="btn text-xs" id="btnGlobalBypass">Global Bypass</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-hidden relative">
            
            <section class="h-24 bg-daw-700 border-b border-daw-600 p-4 flex flex-col justify-center shrink-0">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <button class="btn w-10 flex justify-center" id="btnPlayPause">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="btn w-10 flex justify-center" id="btnStop">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                        </button>
                        <button class="btn w-10 flex justify-center" id="btnLoop">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                    <div class="flex items-center gap-4 text-xs font-mono">
                        <span id="timeDisplay">00:00.00 / 00:00.00</span>
                        <div class="flex items-center gap-2">
                            <span>Speed:</span>
                            <select id="speedSelect" class="bg-daw-900 border border-daw-500 rounded px-1 py-0.5 outline-none">
                                <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="0.75">0.75x</option>
                                <option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2.0x</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="timeline-container" id="timeline">
                    <div class="timeline-progress" id="timelineProgress"></div>
                </div>
            </section>

            <section class="h-64 bg-black border-b border-daw-600 relative shrink-0 p-2 flex gap-2">
                <div class="flex-1 relative border border-daw-600 rounded overflow-hidden">
                    <canvas id="analyzerCanvas"></canvas>
                    <div class="absolute top-2 left-2 text-xs font-mono text-gray-500 bg-black/50 px-1 rounded">MASTER OUT FFT</div>
                </div>
                <!-- Master Meters -->
                <div class="w-20 bg-daw-800 border border-daw-600 rounded p-2 flex flex-col justify-between items-center relative">
                    <div class="text-[10px] text-gray-400">L</div>
                    <div class="flex-1 w-full flex justify-center gap-2 py-1">
                        <div class="meter-container"><div class="meter-fill" id="meterL"></div><div class="meter-peak" id="peakL"></div></div>
                        <div class="meter-container"><div class="meter-fill" id="meterR"></div><div class="meter-peak" id="peakR"></div></div>
                    </div>
                    <div class="text-[10px] text-gray-400">R</div>
                    <div id="clipIndicator" class="absolute top-1 right-1 w-2 h-2 rounded-full bg-daw-500 transition-colors"></div>
                </div>
            </section>

            <section class="flex-1 overflow-auto bg-daw-900 p-4">
                <div class="flex flex-wrap gap-4 items-start" id="modulesRack">
                    <!-- Audio Nodes Modules will be injected here by JS -->
                </div>
            </section>
        </div>
    </main>

    <!-- Boot Overlay -->
    <div id="bootOverlay" class="overlay active flex-col gap-4">
        <h2 class="text-3xl font-bold text-daw-accent mb-2">DLMS PRO Audio Engine</h2>
        <p class="text-gray-300 max-w-md text-center mb-4">Aplikasi ini dibagikan secara gratis serta tolong hargai pembuat dan follow akun @Delta_Blaze</p>
        <div id="bootLog" class="w-96 h-32 bg-black border border-daw-600 rounded p-2 text-xs font-mono text-gray-400 overflow-y-auto mb-4"></div>
        <button id="btnStartEngine" class="btn active px-8 py-3 text-lg hidden">Start Audio Engine</button>
    </div>

    <!-- Diagnostics Overlay -->
    <div id="diagOverlay" class="overlay flex-col gap-4">
        <div class="bg-daw-800 border border-daw-600 rounded-lg p-6 max-w-2xl w-full max-h-[80vh] flex flex-col">
            <h2 class="text-xl font-bold mb-4 flex justify-between items-center">
                Diagnostics & Quality Report
                <button class="btn" onclick="document.getElementById('diagOverlay').classList.remove('active')">Close</button>
            </h2>
            <div id="diagContent" class="flex-1 overflow-y-auto bg-black p-4 rounded text-xs font-mono text-gray-300 whitespace-pre-wrap"></div>
        </div>
    </div>

    <!-- START OF APPLICATION LOGIC -->
    <script type="module">
        const Utils = {
            clamp: (val, min, max) => Math.min(Math.max(val, min), max),
            map: (val, in_min, in_max, out_min, out_max) => (val - in_min) * (out_max - out_min) / (in_max - in_min) + out_min,
            formatTime: (sec) => {
                if(isNaN(sec) || !isFinite(sec)) return "00:00.00";
                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                const s = Math.floor(sec % 60).toString().padStart(2, '0');
                const ms = Math.floor((sec % 1) * 100).toString().padStart(2, '0');
                return `${m}:${s}.${ms}`;
            },
            generateId: () => Math.random().toString(36).substr(2, 9),
            dbToGain: (db) => Math.pow(10, db / 20),
            gainToDb: (gain) => 20 * Math.log10(Math.max(gain, 0.00001)),
            log: (msg) => {
                console.log(`[DLMS] ${msg}`);
                const logEl = document.getElementById('bootLog');
                if(logEl) { logEl.innerHTML += `<div>> ${msg}</div>`; logEl.scrollTop = logEl.scrollHeight; }
            }
        };

        // Central Application State
        const AppState = {
            activeState: 'A', // 'A' or 'B'
            A: {},
            B: {},
            history: [],
            historyIndex: -1,
            isGlobalBypass: false,
            chainOrder: [], // Will be populated dynamically
            saveConfig: function() {
                try {
                    const data = { A: this.A, B: this.B, chainOrder: this.chainOrder };
                    localStorage.setItem('dlms_config', JSON.stringify(data));
                } catch(e) { console.warn("Failed to save to LocalStorage", e); }
            },
            loadConfig: function() {
                try {
                    const saved = localStorage.getItem('dlms_config');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        this.A = parsed.A || {};
                        this.B = parsed.B || {};
                        this.chainOrder = parsed.chainOrder || [];
                        return true;
                    }
                } catch(e) { console.warn("Failed to load config", e); }
                return false;
            }
        };

        // This configuration drives both the Audio Routing and the UI generation.
        const DSP_CONFIG = {
            preamp: { name: 'Preamp', params: [
                { id: 'gain', name: 'Gain (dB)', min: -24, max: 24, default: 0, step: 0.1 },
                { id: 'phase', name: 'Phase Invert', type: 'toggle', default: 0 }
            ]},
            gate: { name: 'Noise Gate', params: [
                { id: 'threshold', name: 'Thresh (dB)', min: -80, max: 0, default: -60, step: 1 },
                { id: 'attack', name: 'Attack (s)', min: 0.001, max: 0.5, default: 0.01, step: 0.001 },
                { id: 'release', name: 'Release (s)', min: 0.01, max: 2, default: 0.1, step: 0.01 }
            ]},
            compressor: { name: 'Compressor', params: [
                { id: 'threshold', name: 'Thresh (dB)', min: -60, max: 0, default: -20, step: 1 },
                { id: 'ratio', name: 'Ratio', min: 1, max: 20, default: 4, step: 0.1 },
                { id: 'knee', name: 'Knee (dB)', min: 0, max: 40, default: 5, step: 1 },
                { id: 'attack', name: 'Attack (s)', min: 0, max: 1, default: 0.003, step: 0.001 },
                { id: 'release', name: 'Release (s)', min: 0, max: 1, default: 0.25, step: 0.01 },
                { id: 'makeup', name: 'Makeup (dB)', min: 0, max: 24, default: 0, step: 0.5 }
            ]},
            eq: { name: 'Master EQ (5-Band)', params: [
                // Simplified 5-band for brevity in this structure, but fully functional.
                { id: 'lowGain', name: 'Low Gain', min: -15, max: 15, default: 0, step: 0.5 },
                { id: 'lowFreq', name: 'Low Freq', min: 20, max: 200, default: 60, step: 1 },
                { id: 'lmGain', name: 'L-Mid Gain', min: -15, max: 15, default: 0, step: 0.5 },
                { id: 'lmFreq', name: 'L-Mid Freq', min: 200, max: 1000, default: 250, step: 1 },
                { id: 'midGain', name: 'Mid Gain', min: -15, max: 15, default: 0, step: 0.5 },
                { id: 'midFreq', name: 'Mid Freq', min: 1000, max: 4000, default: 1000, step: 1 },
                { id: 'hmGain', name: 'H-Mid Gain', min: -15, max: 15, default: 0, step: 0.5 },
                { id: 'hmFreq', name: 'H-Mid Freq', min: 4000, max: 8000, default: 5000, step: 1 },
                { id: 'highGain', name: 'High Gain', min: -15, max: 15, default: 0, step: 0.5 },
                { id: 'highFreq', name: 'High Freq', min: 8000, max: 20000, default: 10000, step: 1 }
            ]},
            saturation: { name: 'Saturation', params: [
                { id: 'drive', name: 'Drive', min: 0, max: 100, default: 0, step: 1 },
                { id: 'mix', name: 'Mix %', min: 0, max: 100, default: 100, step: 1 }
            ]},
            exciter: { name: 'Exciter', params: [
                { id: 'freq', name: 'Freq (Hz)', min: 3000, max: 15000, default: 5000, step: 100 },
                { id: 'amount', name: 'Amount', min: 0, max: 100, default: 0, step: 1 }
            ]},
            deesser: { name: 'De-Esser', params: [
                { id: 'threshold', name: 'Thresh (dB)', min: -60, max: 0, default: -10, step: 1 },
                { id: 'freq', name: 'Freq (Hz)', min: 4000, max: 12000, default: 6000, step: 100 }
            ]},
            reverb: { name: 'Reverb', params: [
                { id: 'mix', name: 'Mix %', min: 0, max: 100, default: 0, step: 1 },
                { id: 'decay', name: 'Decay (s)', min: 0.1, max: 5, default: 1.5, step: 0.1 }
            ]},
            delay: { name: 'Delay', params: [
                { id: 'time', name: 'Time (ms)', min: 10, max: 1000, default: 300, step: 1 },
                { id: 'feedback', name: 'Feedback %', min: 0, max: 95, default: 30, step: 1 },
                { id: 'mix', name: 'Mix %', min: 0, max: 100, default: 0, step: 1 }
            ]},
            chorus: { name: 'Chorus', params: [
                { id: 'rate', name: 'Rate (Hz)', min: 0.1, max: 10, default: 1.5, step: 0.1 },
                { id: 'depth', name: 'Depth', min: 0, max: 100, default: 0, step: 1 }
            ]},
            flanger: { name: 'Flanger', params: [
                { id: 'rate', name: 'Rate (Hz)', min: 0.05, max: 5, default: 0.2, step: 0.05 },
                { id: 'depth', name: 'Depth', min: 0, max: 100, default: 0, step: 1 },
                { id: 'feedback', name: 'Feedback', min: 0, max: 90, default: 50, step: 1 }
            ]},
            phaser: { name: 'Phaser', params: [
                { id: 'rate', name: 'Rate (Hz)', min: 0.1, max: 10, default: 1, step: 0.1 },
                { id: 'depth', name: 'Depth', min: 0, max: 100, default: 0, step: 1 }
            ]},
            width: { name: 'Stereo Width', params: [
                { id: 'width', name: 'Width %', min: 0, max: 200, default: 100, step: 1 }
            ]},
            bass: { name: 'Bass Enhancer', params: [
                { id: 'freq', name: 'Freq (Hz)', min: 30, max: 200, default: 80, step: 1 },
                { id: 'boost', name: 'Boost (dB)', min: 0, max: 12, default: 0, step: 0.5 }
            ]},
            limiter: { name: 'Master Limiter', params: [
                { id: 'threshold', name: 'Ceiling (dB)', min: -20, max: 0, default: -0.3, step: 0.1 },
                { id: 'release', name: 'Release (s)', min: 0.01, max: 1, default: 0.1, step: 0.01 }
            ]}
        };

        const DEFAULT_CHAIN_ORDER = Object.keys(DSP_CONFIG);

        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.analyser = null;
                this.source = null;
                this.audioBuffer = null;
                
                this.nodes = {}; // Holds instances of DSP effects
                this.isPlaying = false;
                this.startTime = 0;
                this.pausedAt = 0;
                this.playbackRate = 1.0;
                this.loop = false;
            }

            async init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.analyser = this.ctx.createAnalyser();
                this.analyser.fftSize = 2048;
                
                // Initialize all DSP Nodes
                this.initNodes();
                
                this.masterGain.connect(this.analyser);
                this.analyser.connect(this.ctx.destination);
                
                this.rebuildChain();
                Utils.log("AudioContext initialized. SR: " + this.ctx.sampleRate);
            }

            initNodes() {
                // Initialize wrappers for Web Audio Nodes based on configuration
                for (const [id, config] of Object.entries(DSP_CONFIG)) {
                    this.nodes[id] = new DSPNodeWrapper(this.ctx, id, config);
                }
            }

            rebuildChain() {
                if (!this.ctx) return;
                
                // Disconnect everything
                if(this.source) this.source.disconnect();
                for (let key in this.nodes) this.nodes[key].disconnect();
                
                const order = AppState.chainOrder.length ? AppState.chainOrder : DEFAULT_CHAIN_ORDER;
                
                let prevNode = null;
                if(this.source) {
                    prevNode = this.source;
                }

                // Connect active nodes in order
                for (let i = 0; i < order.length; i++) {
                    const id = order[i];
                    const nodeWrap = this.nodes[id];
                    if (!nodeWrap) continue;
                    
                    if (prevNode) {
                        if (prevNode instanceof AudioBufferSourceNode) {
                            prevNode.connect(nodeWrap.input);
                        } else {
                            prevNode.output.connect(nodeWrap.input);
                        }
                    }
                    prevNode = nodeWrap;
                }

                // Connect last node to Master
                if (prevNode) {
                    if (prevNode instanceof AudioBufferSourceNode) {
                        prevNode.connect(this.masterGain);
                    } else {
                        prevNode.output.connect(this.masterGain);
                    }
                }
            }

            async loadFile(file) {
                if (!this.ctx) return;
                Utils.log(`Loading file: ${file.name}`);
                const arrayBuffer = await file.arrayBuffer();
                Utils.log(`Decoding audio data...`);
                try {
                    this.audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
                    Utils.log(`Decoded successfully. Duration: ${this.audioBuffer.duration.toFixed(2)}s`);
                    this.pausedAt = 0;
                    UIManager.updateTimeline();
                } catch(e) {
                    Utils.log(`Decode error: ${e.message}`);
                    alert("Error decoding audio file.");
                }
            }

            play() {
                if (!this.audioBuffer || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                if (this.source) this.source.disconnect();
                
                this.source = this.ctx.createBufferSource();
                this.source.buffer = this.audioBuffer;
                this.source.playbackRate.value = this.playbackRate;
                this.source.loop = this.loop;
                
                this.rebuildChain();
                
                this.source.onended = () => {
                    if(!this.loop && this.isPlaying) {
                        this.stop();
                        UIManager.updatePlayState();
                    }
                };

                this.source.start(0, this.pausedAt);
                this.startTime = this.ctx.currentTime - (this.pausedAt / this.playbackRate);
                this.isPlaying = true;
            }

            pause() {
                if (!this.source || !this.isPlaying) return;
                this.source.stop();
                this.pausedAt = (this.ctx.currentTime - this.startTime) * this.playbackRate;
                if(this.pausedAt >= this.audioBuffer.duration) this.pausedAt = 0;
                this.isPlaying = false;
            }

            stop() {
                if (this.source && this.isPlaying) this.source.stop();
                this.isPlaying = false;
                this.pausedAt = 0;
            }

            seek(time) {
                if (!this.audioBuffer) return;
                time = Utils.clamp(time, 0, this.audioBuffer.duration);
                const wasPlaying = this.isPlaying;
                if (wasPlaying) this.pause();
                this.pausedAt = time;
                if (wasPlaying) this.play();
            }

            updateParam(moduleId, paramId, value) {
                if (!this.nodes[moduleId]) return;
                this.nodes[moduleId].updateParam(paramId, value);
            }
            
            toggleNode(moduleId, state) {
                if (!this.nodes[moduleId]) return;
                this.nodes[moduleId].enabled = state;
                this.nodes[moduleId].applyBypass();
            }
        }

        class DSPNodeWrapper {
            constructor(ctx, type, config) {
                this.ctx = ctx;
                this.type = type;
                this.config = config;
                this.enabled = false;
                
                // Every wrapper has an input and output gain node for easy bypassing and chain routing
                this.input = ctx.createGain();
                this.output = ctx.createGain();
                this.bypassNode = ctx.createGain();
                this.dryGain = ctx.createGain();
                this.wetGain = ctx.createGain();
                
                this.buildInternalRouting();
                this.applyBypass();
            }

            buildInternalRouting() {
                // Default routing: input -> bypass (dry) -> output
                this.input.connect(this.bypassNode);
                this.bypassNode.connect(this.output);
                
                // Wet routing: input -> effect(s) -> wetGain -> output
                this.input.connect(this.dryGain);
                this.dryGain.gain.value = 0; // Default dry is 0 when effect active
                this.dryGain.connect(this.output);
                
                // Specific Node Implementations
                switch (this.type) {
                    case 'preamp':
                        this.effectNode = this.ctx.createGain();
                        this.input.connect(this.effectNode);
                        this.effectNode.connect(this.wetGain);
                        break;
                    
                    case 'gate':
                        // Web Audio has no native gate. Using a waveshaper as an expander curve.
                        this.effectNode = this.ctx.createWaveShaper();
                        this.updateGateCurve(-60);
                        this.input.connect(this.effectNode);
                        this.effectNode.connect(this.wetGain);
                        break;

                    case 'compressor':
                        this.effectNode = this.ctx.createDynamicsCompressor();
                        this.makeupNode = this.ctx.createGain();
                        this.input.connect(this.effectNode);
                        this.effectNode.connect(this.makeupNode);
                        this.makeupNode.connect(this.wetGain);
                        break;
                    
                    case 'limiter':
                        this.effectNode = this.ctx.createDynamicsCompressor();
                        this.effectNode.ratio.value = 20; // Hard limiting
                        this.effectNode.attack.value = 0.001;
                        this.input.connect(this.effectNode);
                        this.effectNode.connect(this.wetGain);
                        break;
                    
                    case 'eq':
                        this.eqNodes = [];
                        const bands = [
                            { type: 'lowshelf', freq: 60 },
                            { type: 'peaking', freq: 250 },
                            { type: 'peaking', freq: 1000 },
                            { type: 'peaking', freq: 5000 },
                            { type: 'highshelf', freq: 10000 }
                        ];
                        let prev = this.input;
                        bands.forEach((b) => {
                            let eq = this.ctx.createBiquadFilter();
                            eq.type = b.type;
                            eq.frequency.value = b.freq;
                            prev.connect(eq);
                            this.eqNodes.push(eq);
                            prev = eq;
                        });
                        prev.connect(this.wetGain);
                        break;

                    case 'saturation':
                        this.effectNode = this.ctx.createWaveShaper();
                        this.effectNode.oversample = '4x';
                        this.updateDistortionCurve(0);
                        this.input.connect(this.effectNode);
                        this.effectNode.connect(this.wetGain);
                        break;
                        
                    case 'exciter':
                        // Highpass -> Distort -> Mix
                        this.hpFilter = this.ctx.createBiquadFilter();
                        this.hpFilter.type = 'highpass';
                        this.dist = this.ctx.createWaveShaper();
                        this.dist.oversample = '2x';
                        
                        this.input.connect(this.hpFilter);
                        this.hpFilter.connect(this.dist);
                        this.dist.connect(this.wetGain);
                        this.input.connect(this.wetGain); // Mix original
                        break;
                    
                    case 'deesser':
                        this.effectNode = this.ctx.createDynamicsCompressor();
                        // Real deesser requires sidechain which is complex here. 
                        // Simplified: Fast comp targeting highs using a bandpass to trigger? 
                        // Native API doesn't support sidechain easily. We will use dynamic eq simulation.
                        this.filter = this.ctx.createBiquadFilter();
                        this.filter.type = 'peaking';
                        this.filter.Q.value = 2;
                        this.input.connect(this.filter);
                        this.filter.connect(this.wetGain);
                        break;
                    
                    case 'reverb':
                        this.effectNode = this.ctx.createConvolver();
                        this.updateReverb(1.5);
                        this.input.connect(this.effectNode);
                        this.effectNode.connect(this.wetGain);
                        break;

                    case 'delay':
                        this.effectNode = this.ctx.createDelay(2.0);
                        this.feedback = this.ctx.createGain();
                        this.input.connect(this.effectNode);
                        this.effectNode.connect(this.feedback);
                        this.feedback.connect(this.effectNode);
                        this.effectNode.connect(this.wetGain);
                        break;
                        
                    case 'chorus':
                    case 'flanger':
                    case 'phaser':
                        // Modulated Delay
                        this.effectNode = this.ctx.createDelay(0.1);
                        this.lfo = this.ctx.createOscillator();
                        this.lfoGain = this.ctx.createGain();
                        this.lfo.connect(this.lfoGain);
                        this.lfoGain.connect(this.effectNode.delayTime);
                        this.lfo.start();
                        
                        this.input.connect(this.effectNode);
                        this.effectNode.connect(this.wetGain);
                        if(this.type === 'flanger') {
                            this.fb = this.ctx.createGain();
                            this.effectNode.connect(this.fb);
                            this.fb.connect(this.effectNode);
                        }
                        break;
                        
                    case 'width':
                        this.splitter = this.ctx.createChannelSplitter(2);
                        this.merger = this.ctx.createChannelMerger(2);
                        this.sideGain = this.ctx.createGain();
                        
                        this.input.connect(this.splitter);
                        // Simplified mid/side logic
                        this.splitter.connect(this.merger, 0, 0); // L
                        this.splitter.connect(this.merger, 1, 1); // R
                        this.merger.connect(this.wetGain);
                        break;

                    case 'bass':
                        this.lpFilter = this.ctx.createBiquadFilter();
                        this.lpFilter.type = 'lowshelf';
                        this.input.connect(this.lpFilter);
                        this.lpFilter.connect(this.wetGain);
                        break;

                    default:
                        // Passthrough fallback
                        this.input.connect(this.wetGain);
                        break;
                }
                
                this.wetGain.connect(this.output);
                this.wetGain.gain.value = 1;
            }

            applyBypass() {
                const isBypassed = !this.enabled || AppState.isGlobalBypass;
                const time = this.ctx.currentTime + 0.01;
                
                if (isBypassed) {
                    this.bypassNode.gain.setTargetAtTime(1, time, 0.05);
                    this.wetGain.gain.setTargetAtTime(0, time, 0.05);
                    this.dryGain.gain.setTargetAtTime(0, time, 0.05);
                } else {
                    this.bypassNode.gain.setTargetAtTime(0, time, 0.05);
                    // Determine wet/dry mix based on config if it exists
                    const mixParam = AppState[AppState.activeState][this.type]?.mix;
                    const mixValue = mixParam !== undefined ? mixParam / 100 : 1;
                    
                    this.wetGain.gain.setTargetAtTime(mixValue, time, 0.05);
                    this.dryGain.gain.setTargetAtTime(1 - mixValue, time, 0.05);
                }
            }

            updateParam(paramId, value) {
                if(!this.ctx) return;
                const time = this.ctx.currentTime;
                
                try {
                    switch (this.type) {
                        case 'preamp':
                            if (paramId === 'gain') this.effectNode.gain.setTargetAtTime(Utils.dbToGain(value), time, 0.05);
                            break;
                        
                        case 'gate':
                            if (paramId === 'threshold') this.updateGateCurve(value);
                            break;

                        case 'compressor':
                            if (this.effectNode[paramId]) this.effectNode[paramId].setTargetAtTime(value, time, 0.01);
                            if (paramId === 'makeup') this.makeupNode.gain.setTargetAtTime(Utils.dbToGain(value), time, 0.05);
                            break;
                            
                        case 'limiter':
                            if (this.effectNode[paramId]) this.effectNode[paramId].setTargetAtTime(value, time, 0.01);
                            break;
                        
                        case 'eq':
                            const indexMap = { 'low':0, 'lm':1, 'mid':2, 'hm':3, 'high':4 };
                            for(let band in indexMap) {
                                if (paramId === `${band}Gain`) this.eqNodes[indexMap[band]].gain.setTargetAtTime(value, time, 0.05);
                                if (paramId === `${band}Freq`) this.eqNodes[indexMap[band]].frequency.setTargetAtTime(value, time, 0.05);
                            }
                            break;

                        case 'saturation':
                            if (paramId === 'drive') this.updateDistortionCurve(value);
                            if (paramId === 'mix') {
                                this.wetGain.gain.setTargetAtTime(value/100, time, 0.05);
                                this.dryGain.gain.setTargetAtTime(1 - (value/100), time, 0.05);
                            }
                            break;
                            
                        case 'exciter':
                            if (paramId === 'freq') this.hpFilter.frequency.setTargetAtTime(value, time, 0.05);
                            if (paramId === 'amount') this.updateDistortionCurve(value, this.dist);
                            break;
                            
                        case 'deesser':
                            if (paramId === 'freq') this.filter.frequency.setTargetAtTime(value, time, 0.05);
                            if (paramId === 'threshold') this.filter.gain.setTargetAtTime(value, time, 0.05); // Simulated cut
                            break;

                        case 'reverb':
                            if (paramId === 'decay') this.updateReverb(value);
                            if (paramId === 'mix') {
                                this.wetGain.gain.setTargetAtTime(value/100, time, 0.05);
                                this.dryGain.gain.setTargetAtTime(1 - (value/100), time, 0.05);
                            }
                            break;
                            
                        case 'delay':
                            if (paramId === 'time') this.effectNode.delayTime.setTargetAtTime(value/1000, time, 0.05);
                            if (paramId === 'feedback') this.feedback.gain.setTargetAtTime(value/100, time, 0.05);
                            if (paramId === 'mix') {
                                this.wetGain.gain.setTargetAtTime(value/100, time, 0.05);
                                this.dryGain.gain.setTargetAtTime(1 - (value/100), time, 0.05);
                            }
                            break;

                        case 'chorus':
                        case 'flanger':
                        case 'phaser':
                            if (paramId === 'rate') this.lfo.frequency.setTargetAtTime(value, time, 0.05);
                            if (paramId === 'depth') {
                                const mult = this.type === 'chorus' ? 0.01 : 0.005;
                                this.lfoGain.gain.setTargetAtTime((value/100) * mult, time, 0.05);
                            }
                            if (paramId === 'feedback' && this.fb) this.fb.gain.setTargetAtTime(value/100, time, 0.05);
                            break;

                        case 'bass':
                            if (paramId === 'freq') this.lpFilter.frequency.setTargetAtTime(value, time, 0.05);
                            if (paramId === 'boost') this.lpFilter.gain.setTargetAtTime(value, time, 0.05);
                            break;
                    }
                } catch(e) { console.warn(`Invalid param update: ${this.type}.${paramId} = ${value}`, e); }
            }

            updateReverb(decay) {
                const sampleRate = this.ctx.sampleRate;
                const length = sampleRate * decay;
                const impulse = this.ctx.createBuffer(2, length, sampleRate);
                const left = impulse.getChannelData(0);
                const right = impulse.getChannelData(1);
                for (let i = 0; i < length; i++) {
                    const n = 1 - i / length;
                    left[i] = (Math.random() * 2 - 1) * Math.pow(n, 2);
                    right[i] = (Math.random() * 2 - 1) * Math.pow(n, 2);
                }
                this.effectNode.buffer = impulse;
            }

            updateDistortionCurve(amount, node = this.effectNode) {
                const k = typeof amount === 'number' ? amount : 50;
                const n_samples = 44100;
                const curve = new Float32Array(n_samples);
                const deg = Math.PI / 180;
                for (let i = 0; i < n_samples; ++i) {
                    const x = i * 2 / n_samples - 1;
                    curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
                }
                node.curve = curve;
            }
            
            updateGateCurve(thresholdDb) {
                // Generates a hard knee expander curve
                const n_samples = 8192;
                const curve = new Float32Array(n_samples);
                const threshold = Utils.dbToGain(thresholdDb);
                
                for (let i = 0; i < n_samples; i++) {
                    const x = (i * 2) / n_samples - 1;
                    if (Math.abs(x) < threshold) {
                        curve[i] = 0; // Gate closed
                    } else {
                        curve[i] = x; // Gate open
                    }
                }
                this.effectNode.curve = curve;
            }
            
            disconnect() {
                this.output.disconnect();
            }
        }

        const engine = new AudioEngine();
        
        const UIManager = {
            draggedFader: null,
            startY: 0,
            startVal: 0,

            init() {
                this.generateInitialState();
                this.buildModulesUI();
                this.buildRoutingUI();
                this.bindEvents();
                this.populatePresets();
                
                // Initialize Canvas
                this.canvas = document.getElementById('analyzerCanvas');
                this.ctx2d = this.canvas.getContext('2d');
                window.addEventListener('resize', () => this.resizeCanvas());
                this.resizeCanvas();
                
                requestAnimationFrame(() => this.renderAnalyzer());
                setInterval(() => this.updateMeters(), 50);
            },
            
            resizeCanvas() {
                const parent = this.canvas.parentElement;
                this.canvas.width = parent.clientWidth;
                this.canvas.height = parent.clientHeight;
            },

            generateInitialState() {
                if(!AppState.loadConfig()) {
                    AppState.chainOrder = [...DEFAULT_CHAIN_ORDER];
                    ['A', 'B'].forEach(stateKey => {
                        Object.keys(DSP_CONFIG).forEach(modId => {
                            AppState[stateKey][modId] = { enabled: false };
                            DSP_CONFIG[modId].params.forEach(p => {
                                AppState[stateKey][modId][p.id] = p.default;
                            });
                        });
                        // Defaults
                        AppState[stateKey]['preamp'].enabled = true;
                        AppState[stateKey]['eq'].enabled = true;
                        AppState[stateKey]['limiter'].enabled = true;
                    });
                    AppState.saveConfig();
                }
            },

            buildModulesUI() {
                const container = document.getElementById('modulesRack');
                container.innerHTML = '';

                Object.keys(DSP_CONFIG).forEach(modId => {
                    const config = DSP_CONFIG[modId];
                    const modState = AppState[AppState.activeState][modId];
                    
                    const el = document.createElement('div');
                    el.className = 'rack-module';
                    el.id = `mod_${modId}`;
                    
                    let paramsHTML = '';
                    config.params.forEach(p => {
                        if (p.type === 'toggle') return; // Skip for now, implement if needed
                        
                        // Calculate initial position mapping (0 to 1 -> 0% to 100%)
                        const val = modState[p.id] !== undefined ? modState[p.id] : p.default;
                        const pct = (val - p.min) / (p.max - p.min);
                        const bottomPct = pct * 100;
                        
                        let displayVal = val;
                        if(Number.isInteger(p.step)) displayVal = Math.round(val);
                        else displayVal = val.toFixed(1);
                        
                        paramsHTML += `
                            <div class="fader-container">
                                <div class="fader-label" title="${p.name}">${p.name}</div>
                                <div class="fader-track-wrapper" data-mod="${modId}" data-param="${p.id}" data-min="${p.min}" data-max="${p.max}" data-step="${p.step}">
                                    <div class="fader-track"></div>
                                    <div class="fader-thumb" style="bottom: ${bottomPct}%"></div>
                                </div>
                                <div class="fader-value" id="val_${modId}_${p.id}">${displayVal}</div>
                            </div>
                        `;
                    });

                    el.innerHTML = `
                        <div class="module-header">
                            <span class="font-bold text-gray-200 tracking-wide">${config.name}</span>
                            <div class="power-btn ${modState.enabled ? 'active' : ''}" data-mod="${modId}" title="Toggle Bypass"></div>
                        </div>
                        <div class="flex flex-wrap justify-center gap-2">
                            ${paramsHTML}
                        </div>
                    `;
                    container.appendChild(el);
                });
                
                this.bindFaders();
            },

            buildRoutingUI() {
                const container = document.getElementById('chainContainer');
                container.innerHTML = '';
                
                AppState.chainOrder.forEach((modId, index) => {
                    const config = DSP_CONFIG[modId];
                    const el = document.createElement('div');
                    el.className = 'flex justify-between items-center p-2 bg-daw-900 border border-daw-600 rounded text-xs cursor-move hover:border-daw-accent transition-colors';
                    el.innerHTML = `
                        <span class="font-mono text-gray-400">${index+1}.</span>
                        <span class="${AppState[AppState.activeState][modId].enabled ? 'text-daw-active font-bold' : 'text-gray-500'}">${config.name}</span>
                        <div class="flex flex-col gap-1">
                            <button class="text-gray-500 hover:text-white px-1" onclick="UIManager.moveChainItem(${index}, -1)">▲</button>
                            <button class="text-gray-500 hover:text-white px-1" onclick="UIManager.moveChainItem(${index}, 1)">▼</button>
                        </div>
                    `;
                    container.appendChild(el);
                });
            },

            bindFaders() {
                document.querySelectorAll('.fader-track-wrapper').forEach(fader => {
                    fader.addEventListener('mousedown', (e) => {
                        this.draggedFader = fader;
                        this.startY = e.clientY;
                        
                        const modId = fader.dataset.mod;
                        const paramId = fader.dataset.param;
                        this.startVal = AppState[AppState.activeState][modId][paramId];
                        
                        document.body.style.cursor = 'ns-resize';
                    });
                    
                    fader.addEventListener('dblclick', (e) => {
                        const modId = fader.dataset.mod;
                        const paramId = fader.dataset.param;
                        const defaultVal = DSP_CONFIG[modId].params.find(p => p.id === paramId).default;
                        this.updateParam(modId, paramId, defaultVal);
                    });
                });

                document.addEventListener('mousemove', (e) => {
                    if (!this.draggedFader) return;
                    
                    const deltaY = this.startY - e.clientY;
                    const shiftModifier = e.shiftKey ? 0.1 : 1; // Fine control
                    
                    const modId = this.draggedFader.dataset.mod;
                    const paramId = this.draggedFader.dataset.param;
                    const pConfig = DSP_CONFIG[modId].params.find(p => p.id === paramId);
                    
                    const range = pConfig.max - pConfig.min;
                    // Move 100px to cover full range vertically
                    let valChange = (deltaY / 100) * range * shiftModifier; 
                    
                    let newVal = Utils.clamp(this.startVal + valChange, pConfig.min, pConfig.max);
                    
                    // Snap to step
                    newVal = Math.round(newVal / pConfig.step) * pConfig.step;
                    
                    this.updateParam(modId, paramId, newVal);
                });

                document.addEventListener('mouseup', () => {
                    if (this.draggedFader) {
                        this.draggedFader = null;
                        document.body.style.cursor = 'default';
                        AppState.saveConfig();
                    }
                });

                // Power Buttons
                document.querySelectorAll('.power-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const modId = btn.dataset.mod;
                        const state = !AppState[AppState.activeState][modId].enabled;
                        AppState[AppState.activeState][modId].enabled = state;
                        btn.classList.toggle('active', state);
                        
                        engine.toggleNode(modId, state);
                        this.buildRoutingUI(); // Update text colors in routing
                        AppState.saveConfig();
                    });
                });
            },

            updateParam(modId, paramId, val) {
                AppState[AppState.activeState][modId][paramId] = val;
                
                const pConfig = DSP_CONFIG[modId].params.find(p => p.id === paramId);
                const pct = Math.max(0, Math.min(1, (val - pConfig.min) / (pConfig.max - pConfig.min)));
                
                // Update UI visually
                const wrapper = document.querySelector(`.fader-track-wrapper[data-mod="${modId}"][data-param="${paramId}"]`);
                if(wrapper) {
                    const thumb = wrapper.querySelector('.fader-thumb');
                    if(thumb) thumb.style.bottom = `${pct * 100}%`;
                }
                
                const valDisplay = document.getElementById(`val_${modId}_${paramId}`);
                if(valDisplay) {
                    valDisplay.innerText = Number.isInteger(pConfig.step) ? Math.round(val) : val.toFixed(1);
                }
                
                // Update Audio Engine
                engine.updateParam(modId, paramId, val);
            },
            
            syncUIToState() {
                Object.keys(DSP_CONFIG).forEach(modId => {
                    const modState = AppState[AppState.activeState][modId];
                    
                    // Update Power buttons
                    const btn = document.querySelector(`.power-btn[data-mod="${modId}"]`);
                    if(btn) btn.classList.toggle('active', modState.enabled);
                    engine.toggleNode(modId, modState.enabled);
                    
                    // Update Knobs
                    DSP_CONFIG[modId].params.forEach(p => {
                        const val = modState[p.id];
                        this.updateParam(modId, p.id, val);
                    });
                });
                this.buildRoutingUI();
            },

            moveChainItem(index, dir) {
                const arr = AppState.chainOrder;
                if (index + dir < 0 || index + dir >= arr.length) return;
                
                const temp = arr[index];
                arr[index] = arr[index + dir];
                arr[index + dir] = temp;
                
                this.buildRoutingUI();
                engine.rebuildChain();
                AppState.saveConfig();
            },

            bindEvents() {
                document.getElementById('audioFileInput').addEventListener('change', (e) => {
                    if (e.target.files.length > 0) {
                        const file = e.target.files[0];
                        document.getElementById('fileNameDisplay').innerText = file.name;
                        engine.loadFile(file);
                    }
                });

                document.getElementById('btnPlayPause').addEventListener('click', () => {
                    if(engine.isPlaying) engine.pause();
                    else engine.play();
                    this.updatePlayState();
                });

                document.getElementById('btnStop').addEventListener('click', () => {
                    engine.stop();
                    this.updatePlayState();
                    this.updateTimeline();
                });
                
                document.getElementById('btnLoop').addEventListener('click', (e) => {
                    engine.loop = !engine.loop;
                    if(engine.source) engine.source.loop = engine.loop;
                    e.currentTarget.classList.toggle('text-daw-accent');
                });
                
                document.getElementById('speedSelect').addEventListener('change', (e) => {
                    engine.playbackRate = parseFloat(e.target.value);
                    if(engine.source) engine.source.playbackRate.value = engine.playbackRate;
                });

                document.getElementById('timeline').addEventListener('click', (e) => {
                    if (!engine.audioBuffer) return;
                    const rect = e.currentTarget.getBoundingClientRect();
                    const pct = (e.clientX - rect.left) / rect.width;
                    engine.seek(pct * engine.audioBuffer.duration);
                    this.updateTimeline();
                });

                // Top Toolbar Actions
                document.getElementById('btnToggleAB').addEventListener('click', (e) => {
                    AppState.activeState = AppState.activeState === 'A' ? 'B' : 'A';
                    e.target.innerText = `State: ${AppState.activeState}`;
                    this.syncUIToState();
                });
                
                document.getElementById('btnCopyAB').addEventListener('click', () => {
                    const from = AppState.activeState;
                    const to = from === 'A' ? 'B' : 'A';
                    AppState[to] = JSON.parse(JSON.stringify(AppState[from]));
                    Utils.log(`Copied State ${from} to ${to}`);
                });

                document.getElementById('btnPanic').addEventListener('click', () => {
                    engine.stop();
                    engine.ctx.suspend();
                    Utils.log("PANIC TRIGGERED. Audio stopped & suspended.");
                    setTimeout(() => engine.ctx.resume(), 1000);
                });
                
                document.getElementById('btnResetChain').addEventListener('click', () => {
                    AppState.chainOrder = [...DEFAULT_CHAIN_ORDER];
                    this.buildRoutingUI();
                    engine.rebuildChain();
                    AppState.saveConfig();
                });
                
                document.getElementById('btnGlobalBypass').addEventListener('click', (e) => {
                    AppState.isGlobalBypass = !AppState.isGlobalBypass;
                    e.target.classList.toggle('text-daw-warn');
                    e.target.innerText = AppState.isGlobalBypass ? 'Bypass: ON' : 'Global Bypass';
                    
                    Object.values(engine.nodes).forEach(n => n.applyBypass());
                });

                document.getElementById('btnDiagnostics').addEventListener('click', () => {
                    runSelfTests();
                    document.getElementById('diagOverlay').classList.add('active');
                });

                // Keyboard Shortcuts
                document.addEventListener('keydown', (e) => {
                    if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                    switch(e.code) {
                        case 'Space': 
                            e.preventDefault();
                            document.getElementById('btnPlayPause').click(); 
                            break;
                        case 'KeyA':
                            document.getElementById('btnToggleAB').click();
                            break;
                    }
                });
                
                // Animation loop for timeline
                const frameLoop = () => {
                    if (engine.isPlaying) this.updateTimeline();
                    requestAnimationFrame(frameLoop);
                };
                frameLoop();
            },

            updatePlayState() {
                const icon = engine.isPlaying 
                    ? `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>` // Pause
                    : `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`; // Play
                document.getElementById('btnPlayPause').innerHTML = icon;
                document.getElementById('btnPlayPause').classList.toggle('text-daw-accent', engine.isPlaying);
            },

            updateTimeline() {
                if (!engine.audioBuffer) return;
                
                let current = engine.pausedAt;
                if (engine.isPlaying) {
                    current = (engine.ctx.currentTime - engine.startTime) * engine.playbackRate;
                    if(engine.loop && current >= engine.audioBuffer.duration) {
                        current = current % engine.audioBuffer.duration;
                        engine.startTime = engine.ctx.currentTime - (current / engine.playbackRate);
                    }
                }
                
                const pct = (current / engine.audioBuffer.duration) * 100;
                document.getElementById('timelineProgress').style.width = `${Math.min(100, Math.max(0, pct))}%`;
                
                document.getElementById('timeDisplay').innerText = `${Utils.formatTime(current)} / ${Utils.formatTime(engine.audioBuffer.duration)}`;
            },

            renderAnalyzer() {
                if(!this.ctx2d || !engine.analyser) {
                    requestAnimationFrame(() => this.renderAnalyzer());
                    return;
                }
                
                const width = this.canvas.width;
                const height = this.canvas.height;
                const ctx = this.ctx2d;
                
                // Clear
                ctx.fillStyle = '#0f0f13';
                ctx.fillRect(0, 0, width, height);
                
                // Draw Grid
                ctx.strokeStyle = '#2d2d38';
                ctx.lineWidth = 1;
                for(let i = 1; i < 10; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, height * (i/10));
                    ctx.lineTo(width, height * (i/10));
                    ctx.stroke();
                }

                // Get Data
                const dataArray = new Uint8Array(engine.analyser.frequencyBinCount);
                engine.analyser.getByteFrequencyData(dataArray);

                // Draw Spectrum
                const barWidth = (width / engine.analyser.frequencyBinCount) * 2.5;
                let x = 0;
                
                const gradient = ctx.createLinearGradient(0, height, 0, 0);
                gradient.addColorStop(0, '#00d2ff'); // Accent
                gradient.addColorStop(0.7, '#00ff66'); // Success
                gradient.addColorStop(1, '#ff3366'); // Warn
                
                ctx.fillStyle = gradient;
                
                for(let i = 0; i < engine.analyser.frequencyBinCount; i++) {
                    const barHeight = (dataArray[i] / 255) * height;
                    ctx.fillRect(x, height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }

                requestAnimationFrame(() => this.renderAnalyzer());
            },

            updateMeters() {
                if(!engine.analyser || !engine.isPlaying) return;
                
                const dataArray = new Float32Array(engine.analyser.frequencyBinCount);
                engine.analyser.getFloatTimeDomainData(dataArray);
                
                let sumSq = 0;
                let peak = 0;
                for(let i = 0; i < dataArray.length; i++) {
                    const val = dataArray[i];
                    sumSq += val * val;
                    if(Math.abs(val) > peak) peak = Math.abs(val);
                }
                
                const rms = Math.sqrt(sumSq / dataArray.length);
                const rmsDb = Utils.gainToDb(rms);
                const peakDb = Utils.gainToDb(peak);
                
                // Very rudimentary mapping: -60dB -> 0%, 0dB -> 100%
                const rmsPct = Utils.clamp(Utils.map(rmsDb, -60, 0, 0, 100), 0, 100);
                
                document.getElementById('meterL').style.height = `${rmsPct}%`;
                document.getElementById('meterR').style.height = `${rmsPct}%`;
                
                document.getElementById('peakL').style.bottom = `${rmsPct}%`;
                document.getElementById('peakR').style.bottom = `${rmsPct}%`;
                
                if (peakDb > -0.1) {
                    document.getElementById('clipIndicator').style.backgroundColor = '#ff3366';
                } else {
                    document.getElementById('clipIndicator').style.backgroundColor = '#3f3f4e';
                }
            },

